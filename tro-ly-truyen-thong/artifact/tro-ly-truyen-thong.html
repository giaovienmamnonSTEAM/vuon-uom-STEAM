Nguyên tắc bắt buộc:
- Viết tiếng Việt có dấu chuẩn, đúng chính tả, câu rõ ràng, lịch sự, phù hợp môi trường giáo dục mầm non.
- CHỈ dùng thông tin giáo viên cung cấp. Không tự bịa tên người, tên trường, ngày giờ, địa điểm, số tiền, số liệu, thành tích, kết quả học tập hay tình hình sức khỏe. Nếu thiếu thông tin quan trọng, để chỗ trống dạng [Thời gian], [Địa điểm]… cho giáo viên tự điền.
- Giữ nguyên chính xác mọi ngày tháng, giờ, số liệu, tên riêng giáo viên đưa ra.
- Không phán xét trẻ, không đổ lỗi cho phụ huynh, không dùng từ ngữ gây tổn thương hoặc dễ hiểu lầm. Không nêu thông tin riêng tư của trẻ.
- Về sức khỏe: không chẩn đoán, không khuyên dùng thuốc hay liều lượng; khuyến khích phụ huynh hỏi ý kiến cán bộ y tế khi cần.

alo/điện thoại. Mở đầu bằng lời chào, nội dung ngắn gọn, kết bằng lời cảm ơn. Với tình huống nhạy cảm hoặc nề nếp: mô tả hành vi cụ thể một cách khách quan, nhẹ nhàng, nói rõ cô sẽ hỗ trợ con thế nào, mời phụ huynh cùng phối hợp hoặc trao đổi trực tiếp; tuyệt đối không dán nhãn trẻ, không trách phụ huynh, không nhắc tên trẻ khác.","thu-moi":'Soạn một THƯ MỜI/GIẤY MỜI trang trọng, bố cục dễ dán sang Word hoặc Canva: tên đơn vị chủ quản và tên trường (viết hoa), quốc hiệu "CỘNG HÒA XÃ HỘI CHỦ NGHĨA VIỆT NAM" – "Độc lập – Tự do – Hạnh phúc", địa danh ngày tháng (để "…, ngày … tháng … năm …" nếu chưa có), tiêu đề THƯ MỜI, "Trân trọng kính mời:", tên sự kiện, thời gian, địa điểm, chương trình và lưu ý (nếu có), lời kết, "Trân trọng kính mời!", chức vụ và họ tên người ký (nếu có).',"ban-tin":"Soạn BẢN TIN TUẦN của lớp gửi phụ huynh: tiêu đề hấp dẫn, lời mở đầu thân thiện, các mục có tiêu đề nhỏ (chỉ những mục có thông tin), lời kết tích cực. Không thêm hoạt động, nhận xét sức khỏe hay kết quả học tập không có trong dữ liệu.","tuyen-truyen":'Soạn bài TUYÊN TRUYỀN kiến thức nuôi dạy trẻ cho phụ huynh, đúng độ tuổi được chọn: dễ hiểu, thực tế, có những việc cụ thể gia đình làm được tại nhà. Nếu chủ đề liên quan sức khỏe, thêm ý khuyến khích hỏi ý kiến cán bộ y tế khi cần. Hình thức "Tin ngắn gửi Zalo": dưới 150 chữ. "Bảng tin": tiêu đề và các gạch đầu dòng ngắn. "Bài tuyên truyền đầy đủ": có mở bài, các mục, kết bài.',"truyen-thong":"Soạn BÀI TRUYỀN THÔNG cho kênh của nhà trường theo loại bài và độ dài được chọn: có tiêu đề, nội dung chính, lời kết; với Facebook/Zalo/bài lan tỏa thêm 3–6 hashtag phù hợp ở cuối (dùng hashtag riêng của trường nếu có). Bài website không cần hashtag, văn phong báo chí giáo dục. Không thêm số liệu, thành tích, tên người hay chi tiết sự kiện không có trong dữ liệu."},Oa={"sua-chinh-ta":"Sửa lỗi chính tả, dấu câu, viết hoa, khoảng trắng. Giữ nguyên câu chữ và ý của tác giả ở mức tối đa, chỉ sửa lỗi.","than-thien":"Viết lại cho thân thiện, gần gũi h m quen dần với nhiều loại rau, củ bằng cách chế biến đẹp mắt, thay đổi món.","Khen ngợi khi trẻ ăn hết suất hoặc chịu thử món mới."],"4-5":["Cho trẻ cùng tham gia nhặt rau, bày bàn ăn để trẻ hứng thú với bữa ăn.","Trò chuyện với trẻ về tên và lợi ích của các loại thực phẩm."],"5-6":["Hướng dẫn trẻ nhận biết thực phẩm tốt và thực phẩm nên hạn chế.","Duy trì bữa sáng đầy đủ để trẻ có năng lượng học tập, chuẩn bị cho nếp sinh hoạt ở lớp Một."]},medical:"Nếu trẻ biếng ăn kéo dài, chậm tăng cân hoặc có dấu hiệu dị ứng thức ăn, phụ huynh nên đưa trẻ đến cơ sở y tế để được bác sĩ tư vấn, không tự ý cho trẻ dùng thuốc hay thực phẩm chức năng.",slogan:"Ăn đủ chất – Lớn khỏe mạnh – Học vui mỗi ngày!"},"ve-sinh":{title:"Vệ sinh cá nhân – bé sạch, bé khỏe",intro:"Thói quen vệ sinh cá nhân tốt giúp trẻ phòng tránh nhiều bệnh thường gặp và tự tin hơn khi sinh hoạt cùng bạn bè. Thói quen này được hình thành tốt nhất khi gia đình và nhà trường cùng nhắc nhở hằng ngày.",tips:["Hướng dẫn trẻ rửa tay bằng xà phòng và nước sạch trước khi ăn, sau khi đi vệ sinh, sau khi chơi.","Nhắc trẻ chải răng buổi sáng và buổi tối trước khi đi ngủ.","Cắt móng tay, móng chân cho trẻ thường xuyên; giữ quần áo, đầu tóc gọn gàng.","Dạy trẻ che miệng khi ho, hắt hơi và không dùng chung khăn, cốc với người khác.","Làm mẫu và cùng thực hiện với trẻ, biến việc vệ sinh thành trò chơi vui."],byAge:{"24-36":["Người lớn hỗ trợ trẻ rửa tay, lau mặt và cho trẻ làm theo từng bước đơn giản.","Tập cho trẻ báo khi có nhu cầu đi vệ sinh, khen ngợi khi trẻ làm được."],"3-4":["Cho trẻ tự rửa tay, lau mặt với sự quan sát của người lớn.","Dùng bài hát, bài thơ ngắn để trẻ nhớ các bước rửa tay."],"4-5":["Khuyến khích trẻ tự chải răng, tự đi vệ sinh và nhắc trẻ rửa tay sau đó.","Cho trẻ tự chọn khăn, bàn chải riêng để trẻ có ý thức giữ đồ dùng cá nhân."],"5-6":["Để trẻ tự thực hiện đầy đủ các bước rửa tay, chải răng; người lớn kiểm tra và động viên.","Trò chuyện để trẻ hiểu vì sao cần giữ vệ sinh, giúp trẻ tự giác hơn."]},medical:"Khi trẻ có biểu hiện bất thường như sốt, nổi ban, đau bụng, tiêu chảy…, phụ huynh nên cho trẻ nghỉ ngơi, đưa trẻ đến cơ sở y tế để được khám và thông báo cho giáo viên.",slogan:"Bàn tay sạch – Hàm răng xinh – Bé khỏe mạnh!"},"tai-nan":{title:"Phòng tránh tai nạn thương tích cho trẻ",intro:"Trẻ mầm non hiếu động, tò mò nhưng chưa nhận biết hết nguy hiểm. Nhiều tai nạn thương tích có thể phòng tránh được nếu người lớn quan tâm, sắp xếp môi trường an toàn và luôn để mắt tới trẻ.",tips:["Luôn có người lớn trông trẻ, đặc biệt khi trẻ chơi gần nước, ao hồ, bể chứa, xô chậu nước.","Để thuốc, hóa chất tẩy rửa, vật sắc nhọn, bật lửa ở nơi cao, có khóa, ngoài tầm với của trẻ.","Che chắn ổ điện, lan can, cầu thang, cửa sổ; không để trẻ chơi gần bếp đang đun nấu.","Cho trẻ đội mũ bảo hiểm khi ngồi xe máy và ngồi đúng vị trí an toàn.","Dạy trẻ không đi theo, không nhận quà của người lạ; nhớ tên bố mẹ và cách nhờ người lớn giúp đỡ."],byAge:{"24-36":["Không cho trẻ chơi đồ vật nhỏ dễ nuốt (hạt, cúc áo, pin cúc áo, đồ chơi nhỏ) và cắt nhỏ thức ăn để tránh hóc.","Không để trẻ một mình trong nhà tắm, trên giường cao hoặc gần cửa mở."],"3-4":["Dạy trẻ nhận biết đồ vật nguy hiểm: dao, kéo, ổ điện, bếp nóng… qua tranh ảnh, câu chuyện.","Hướng dẫn trẻ đi cầu thang bám tay vịn, không xô đẩy bạn khi chơi."],"4-5":["Dạy trẻ một số quy tắc an toàn khi tham gia giao thông: đi bên phải, nắm tay người lớn khi qua đường.","Tập cho trẻ biết kêu cứu, tìm người lớn khi gặp tình huống nguy hiểm."],"5-6":["Cho trẻ thực hành các kỹ năng như: xử lý khi bị lạc, nhớ số điện thoại người thân, không mở cửa cho người lạ.","Trò chuyện về an toàn khi ở gần nước; tham gia lớp học bơi phù hợp lứa tuổi khi có điều kiện và có người hướng dẫn."]},medical:"Khi trẻ gặp tai nạn (ngã, bỏng, hóc dị vật, đuối nước, ngộ độc…), cần bình tĩnh sơ cứu theo hướng dẫn và nhanh chóng đưa trẻ đến cơ sở y tế gần nhất hoặc gọi cấp cứu 115.",slogan:"Nhà an toàn – Bé vui chơi – Bố mẹ yên tâm!"},"ngon-ngu":{title:"Cùng con phát triển ngôn ngữ",intro:"Ngôn ngữ giúp trẻ bày tỏ suy nghĩ, cảm xúc và kết nối với mọi người. Những cuộc trò chuyện hằng ngày, những câu chuyện trước giờ ngủ là “bài học” quý giá nhất để trẻ phát triển ngôn ngữ.",tips:["Dành thời gian trò chuyện với trẻ mỗi ngày, lắng nghe và đáp lại khi trẻ nói.","Đọc sách, kể chuyện, đọc thơ cho trẻ nghe; khuyến khích trẻ kể lại theo cách của mình.","Dùng câu đơn giản, rõ ràng; nói đúng, không nói ngọng theo trẻ.","Đặt câu hỏi mở như “Vì sao…?”, “Con thấy thế nào…?” để trẻ được diễn đạt.","Hạn chế để trẻ xem màn hình một mình trong thời gian dài, ưu tiên giao tiếp trực tiếp."],byAge:{"24-36":["Gọi tên đồ vật, hành động khi chăm sóc trẻ (“Mẹ đang rửa tay cho con”) để trẻ học từ mới.","Kiên nhẫn chờ trẻ nói, khen khi trẻ cố gắng diễn đạt."],"3-4":["Cho trẻ hát, đọc đồng dao, thơ ngắn; chơi trò gọi tên đồ vật, con vật.","Khuyến khích trẻ nói thành câu khi muốn điều gì."],"4-5":["Cùng trẻ kể lại một ngày ở lớp, xem tranh và đặt câu hỏi về nội dung tranh.","Cho trẻ làm quen với chữ qua sách tranh, biển hiệu trong cuộc sống một cách tự nhiên."],"5-6":["Khuyến khích trẻ kể chuyện sáng tạo, nói về mong muốn, cảm xúc của mình.","Cho trẻ làm quen với chữ cái, cách cầm bút, tư thế ngồi đúng qua trò chơi, không gò ép trẻ học viết trước."]},medical:"Nếu phụ huynh lo lắng về khả năng nghe, nói của trẻ (ví dụ trẻ ít phản ứng với âm thanh, nói rất ít so với bạn cùng tuổi), nên trao đổi với giáo viên và đưa trẻ đến cơ sở y tế chuyên khoa để được tư vấn.",slogan:"Mỗi ngày một câu chuyện – Bé nói giỏi, hiểu nhiều!"},"cam-xuc":{title:"Nuôi dưỡng cảm xúc và kỹ năng xã hội cho trẻ",intro:"Trẻ biết nhận ra và bày tỏ cảm xúc, biết chia sẻ và hợp tác sẽ tự tin, vui vẻ hơn khi đến lớp. Gia đình là nơi đầu tiên trẻ học cách yêu thương và ứng xử.",tips:["Gọi tên cảm xúc cùng trẻ: vui, buồn, giận, sợ… và lắng nghe khi trẻ chia sẻ.","Chấp nhận cảm xúc của trẻ, hướng dẫn trẻ cách bày tỏ phù hợp thay vì quát mắng.","Dạy trẻ nói “cảm ơn”, “xin lỗi”, “xin phép” và làm gương trong cách cư xử hằng ngày.","Tạo cơ hội cho trẻ chơi cùng bạn, chia sẻ đồ chơi, chờ đến lượt.","Khen ngợi cụ thể hành vi tốt của trẻ, tránh so sánh trẻ với bạn khác."],byAge:{"24-36":["Ôm ấp, vỗ về khi trẻ buồn hoặc lo lắng lúc mới đi lớp; nói lời tạm biệt rõ ràng, đón trẻ đúng giờ.","Cho trẻ chơi cạnh bạn, tập chia sẻ đồ chơi đơn giản."],"3-4":["Đọc truyện về cảm xúc và hỏi trẻ “Bạn nhỏ đang cảm thấy thế nào?”.","Hướng dẫn trẻ hít thở sâu, ôm gấu bông khi tức giận."],"4-5":["Cho trẻ cùng giải quyết mâu thuẫn nhỏ với bạn bằng lời nói, có người lớn hỗ trợ.","Giao cho trẻ việc nhỏ giúp đỡ người khác để trẻ thấy mình có ích."],"5-6":["Khuyến khích trẻ làm việc nhóm, biết lắng nghe ý kiến của bạn.","Trò chuyện về những tình huống ứng xử ở trường, ở nhà để trẻ tự đưa ra cách giải quyết."]},medical:"Nếu trẻ có những thay đổi bất thường kéo dài về cảm xúc, hành vi (rất sợ hãi, thu mình, cáu giận thường xuyên), phụ huynh nên trao đổi với giáo viên và tham khảo ý kiến chuyên gia tâm lý hoặc cán bộ y tế.",slogan:"Hiểu con – Yêu con – Đồng hành cùng con!"},"lop-mot":{title:"Chuẩn bị tâm thế cho trẻ vào lớp Một",intro:"Chuẩn bị cho trẻ vào lớp Một không phải là dạy trước chương trình, mà là giúp trẻ sẵn sàng về sức khỏe, cảm xúc, nề nếp và kỹ năng để trẻ tự tin, hào hứng bước vào môi trường mới.",tips:["Trò chuyện tích cực về trường tiểu học, tránh dọa nạt kiểu “Lên lớp Một cô phạt”.","Rèn nếp sinh hoạt: ngủ đủ giấc, dậy đúng giờ, ăn sáng đầy đủ.","Tập cho trẻ tự phục vụ: tự chuẩn bị cặp sách, đồ dùng, tự đi vệ sinh, tự mặc quần áo.","Cho trẻ làm quen với tư thế ngồi, cách cầm bút, cách giở sách qua trò chơi, không ép học viết, học đọc trước.","Khuyến khích trẻ mạnh dạn hỏi khi chưa hiểu, biết nhờ giúp đỡ và hòa đồng với bạn mới."],byAge:{"24-36":["Ở lứa tuổi này, gia đình tập trung xây dựng nền nếp ăn, ngủ, vệ sinh và sự gắn bó, an toàn về cảm xúc cho trẻ."],"3-4":["Hình thành dần nề nếp sinh hoạt đúng giờ và thói quen tự phục vụ đơn giản – nền tảng cho những năm học sau."],"4-5":["Cho trẻ tham gia các trò chơi rèn sự tập trung, ghi nhớ, khéo léo của đôi tay như xâu hạt, cắt dán, xếp hình."],"5-6":["Cùng trẻ tham quan trường tiểu học (nếu có điều kiện), cùng chọn cặp sách, đồ dùng học tập để trẻ hào hứng.","Tập cho trẻ ngồi tập trung trong khoảng thời gian ngắn với một hoạt động yêu thích, tăng dần theo khả năng."]},medical:"Nên cho trẻ khám sức khỏe định kỳ, kiểm tra thị lực, thính lực theo hướng dẫn của cơ sở y tế trước khi vào lớp Một.",slogan:"Sẵn sàng – Tự tin – Vui bước vào lớp Một!"},"phoi-hop":{title:"Gia đình và nhà trường – cùng nhau vì trẻ",intro:"Sự phối hợp chặt chẽ giữa gia đình và nhà trường giúp việc chăm sóc, giáo dục trẻ được thống nhất, liên tục. Khi trẻ thấy bố mẹ và cô giáo cùng đồng lòng, trẻ sẽ yên tâm, tự tin và tiến bộ hơn.",tips:["Thường xuyên trao đổi với giáo viên khi đưa đón trẻ hoặc qua kênh liên lạc của lớp.","Thông báo sớm cho giáo viên khi trẻ có thay đổi về sức khỏe, thói quen, tâm lý.","Duy trì ở nhà những nề nếp, thói quen tốt trẻ được học ở lớp.","Tham gia các buổi họp, hoạt động, ngày hội của lớp và nhà trường khi có thể.","Trao đổi thẳng thắn, tôn trọng khi có băn khoăn; cùng giáo viên tìm cách hỗ trợ trẻ."],byAge:{"24-36":["Giai đoạn trẻ mới đi lớp rất cần gia đình và cô giáo thống nhất giờ ăn, giờ ngủ, cách dỗ dành để trẻ nhanh thích nghi."],"3-4":["Cùng con kể về một ngày ở lớp mỗi tối; hỏi cô về bài hát, bài thơ con được học để cùng ôn ở nhà."],"4-5":["Hưởng ứng các hoạt động lớp đề nghị như góp nguyên vật liệu tái chế, cùng con làm đồ chơi theo chủ đề."],"5-6":["Cùng giáo viên theo dõi sự chuẩn bị của trẻ cho lớp Một: nề nếp, kỹ năng tự phục vụ, sự tự tin trong giao tiếp."]},medical:"",slogan:"Nhà trường – Gia đình chung tay vì trẻ thân yêu!"},"thiet-bi":{title:"Sử dụng thiết bị điện tử hợp lý cho trẻ",intro:"Điện thoại, máy tính bảng, ti vi có thể mang lại một số nội dung hữu ích, nhưng nếu trẻ dùng quá nhiều hoặc xem nội dung không phù hợp sẽ ảnh hưởng đến giấc ngủ, thị lực, ngôn ngữ và sự tương tác của trẻ.",tips:["Đặt quy định rõ ràng về thời gian và nội dung trẻ được xem; người lớn chọn nội dung phù hợp và xem cùng trẻ.","Không dùng điện thoại để dỗ trẻ ăn, dỗ trẻ ngủ.","Không để thiết bị điện tử trong phòng ngủ của trẻ; tắt màn hình trước giờ ngủ.","Thay thế thời gian xem màn hình bằng đọc sách, chơi vận động, chơi ngoài trời, cùng làm việc nhà.","Người lớn hạn chế dùng điện thoại khi ở bên trẻ để làm gương."],byAge:{"24-36":["Với trẻ dưới 3 tuổi, nên hạn chế tối đa thời gian xem màn hình; ưu tiên trò chuyện, chơi và đọc sách cùng trẻ."],"3-4":["Nếu cho trẻ xem, nên chọn nội dung chậm, nhẹ nhàng, có người lớn ngồi cùng và trò chuyện về nội dung."],"4-5":["Thống nhất với trẻ “giờ xem” cụ thể và báo trước khi hết giờ để trẻ không bị hụt hẫng."],"5-6":["Hướng dẫn trẻ hiểu vì sao cần giới hạn thời gian dùng thiết bị và cùng trẻ lên kế hoạch các hoạt động thay thế."]},medical:"Nếu trẻ hay dụi mắt, nheo mắt, khó ngủ hoặc chậm nói, phụ huynh nên đưa trẻ đến cơ sở y tế để được kiểm tra và tư vấn.",slogan:"Bớt màn hình – Thêm yêu thương – Bé lớn khôn!"},"tu-phuc-vu":{title:"Rèn thói quen tự phục vụ cho trẻ",intro:"Khi được tự làm những việc vừa sức, trẻ trở nên tự tin, khéo léo và có trách nhiệm hơn. Mỗi việc nhỏ trẻ tự làm được là một bước trưởng thành.",tips:["Giao cho trẻ những việc vừa sức như tự xúc ăn, tự cất đồ chơi, tự đi dép, cất cặp.","Hướng dẫn từng bước rõ ràng, làm mẫu và kiên nhẫn chờ trẻ làm.","Không làm thay trẻ vì vội; dành thêm thời gian để trẻ tự thực hiện.","Khen ngợi sự cố gắng của trẻ, không chê khi trẻ làm chưa khéo.","Thống nhất với giáo viên để trẻ được rèn đều đặn cả ở nhà và ở lớp."],byAge:{"24-36":["Tập cho trẻ tự cầm cốc uống nước, tự xúc ăn, cởi giày dép, cất đồ chơi vào rổ."],"3-4":["Cho trẻ tự rửa tay, lau mặt, mặc và cởi quần áo đơn giản, cất dép đúng chỗ."],"4-5":["Cho trẻ tự gấp quần áo đơn giản, chuẩn bị đồ dùng cá nhân, giúp người lớn dọn bàn ăn."],"5-6":["Để trẻ tự chuẩn bị cặp sách, tự sắp xếp góc học tập,
