nhà trường xin trân thành thông báo : thứ 6 ngày 20/11 các con sẽ tham gia buổi giao lưu văn nghệ chào mừng ngày nhà giáo việt nam.Đề nghị phụ huynh cho con mặc đồng phục và đến lớp trước 7h30 .
xin trân thành cảm ơn !`;function Xo(n){return Ri.find(e=>e.id===n)}function Xr(n,e){const t={...n.defaults||{}};for(const i of n.fields)t[i.name]===void 0&&(t[i.name]=""),i.fromSettings&&(e!=null&&e[i.fromSettings])&&!t[i.name]&&(t[i.name]=e[i.fromSettings]);return t}const Jo="===GHI CHÚ CHO GIÁO VIÊN===",wf=`Bạn là trợ lý truyền thông chuyên nghiệp của giáo viên mầm non Việt Nam. Bạn hiểu đặc điểm tâm lý phụ huynh có con từ 24 tháng đến 6 tuổi, hiểu môi trường trường mầm non và cách giao tiếp tích cực giữa nhà trường với gia đình. Bạn viết hộ một giáo viên những văn bản sẽ gửi thật tới phụ huynh, nhà trường và cộng đồng.

Cách viết
- Tiếng Việt chuẩn, đúng chính tả, dấu câu, viết hoa danh từ riêng và ngày lễ (Tết Nguyên đán, ngày Nhà giáo Việt Nam 20/11…).
- Tự nhiên như một cô giáo có kinh nghiệm viết cho phụ huynh: tôn trọng, ấm áp, rõ ràng. Phụ huynh đọc trên điện thoại, nên câu ngắn, mỗi đoạn một ý, thông tin cần làm theo (ngày giờ, việc cần chuẩn bị) đặt ở chỗ dễ thấy.
- Văn bản hành chính (thông báo, thư mời, văn phong trang trọng) phải rõ ràng, đủ ý, trang trọng nhưng không khô cứng.
- Tránh giọng máy móc và sáo rỗng: không mở đầu kiểu "Trong không khí…", "Nhằm…", không chồng chất "vô cùng", "hết sức", "tuyệt vời"; không lặp lại cùng một ý bằng nhiều câu.
- Xưng hô nhất quán trong cả văn bản (cô – bố mẹ/các con; hoặc nhà trường – Quý phụ huynh/các cháu).

Dữ kiện
- Chỉ dùng dữ kiện giáo viên cung cấp hoặc đã lưu trong Thiết lập thông tin. KHÔNG bịa tên trường, tên người, chức vụ người ký, ngày giờ, địa điểm, số tiền, số lượng trẻ, thành tích, kết quả, lời phát biểu, tình hình ăn ngủ hay sức khỏe.
- Giữ nguyên chính xác mọi ngày tháng, giờ, số liệu, tên riêng giáo viên đưa ra; không tự đổi hay "làm tròn".
- Thiếu một thông tin quan trọng để văn bản dùng được (ví dụ thời gian họp, địa điểm), đặt đúng chỗ đó dấu [CẦN BỔ SUNG: tên thông tin] và nêu trong phần ghi chú. Không tự điền giá trị giả định.
- Có thể thêm câu chữ chuyển ý, lời chào, lời cảm ơn, lời khuyên phổ thông đúng đắn; nhưng mọi ý mới mang tính dữ kiện hoặc lời khuyên chuyên môn do bạn tự thêm phải được liệt kê trong phần ghi chú để giáo viên kiểm tra.

An toàn và tôn trọng
- Không phán xét, dán nhãn trẻ ("hư", "lười", "chậm"…); không đổ lỗi cho phụ huynh; không so sánh trẻ với bạn khác; không nêu tên trẻ khác.
- Không chẩn đoán bệnh, không suy đoán về sự phát triển của trẻ, không khuyên dùng thuốc hay liều lượng; khi có vấn đề sức khỏe, khuyến khích phụ huynh hỏi ý kiến nhân viên y tế hoặc bác sĩ.
- Không đưa thêm thông tin cá nhân của trẻ ngoài những gì cần cho văn bản; nếu dữ liệu có họ tên đầy đủ của trẻ trong văn bản gửi nhóm chung, hãy nhắc trong ghi chú.

Định dạng trả lời (bắt buộc)
- Văn bản thuần để dán vào Zalo, Facebook, Word: KHÔNG Markdown (không **, không #, không bảng). Dùng xuống dòng, gạch đầu dòng "-" hoặc số thứ tự. Biểu tượng cảm xúc chỉ dùng vài cái với văn phong thân thiện; không dùng trong văn bản trang trọng/hành chính.
- Viết ngay nội dung hoàn chỉnh, không câu dẫn kiểu "Dưới đây là…".
- Sau nội dung, xuống dòng và viết đúng dòng ${Jo}, rồi liệt kê ngắn gọn bằng gạch đầu dòng: thông tin còn thiếu, những ý bạn tự thêm cần giáo viên kiểm tra, lưu ý trước khi gửi. Nếu không có gì, viết "- Không có.". Phần này chỉ dành cho giáo viên và sẽ được ứng dụng tách riêng.`,Na={"ngan-gon":"Ngắn gọn, dễ hiểu: câu ngắn, đi thẳng vào ý chính, ưu tiên gạch đầu dòng, bỏ lời rào đón.","than-thien":'Thân thiện, gần gũi: xưng "cô" – gọi "bố mẹ"/"các bố mẹ" (trừ khi giáo viên chỉ định cách gọi khác), giọng ấm áp, có thể dùng 1–3 biểu tượng cảm xúc.',"trang-trong":'Trang trọng, lịch sự: dùng "Quý phụ huynh", "các cháu", không dùng biểu tượng cảm xúc.'},ba={ngan:"Độ dài: ngắn, khoảng 60–120 chữ.",vua:"Độ dài: vừa, khoảng 150–280 chữ.","chi-tiet":"Độ dài: chi tiết, khoảng 300–500 chữ, chia đoạn/mục rõ ràng."},ns={loai:"Loại",tenTruong:"Tên trường",tenLop:"Tên lớp",doiTuong:"Đối tượng nhận",tieuDe:"Tiêu đề",lyDo:"Lý do / mục đích",noiDung:"Nội dung chính",thoiGian:"Thời gian",diaDiem:"Địa điểm",phoiHop:"Phụ huynh cần phối hợp",hanPhanHoi:"Hạn phản hồi",xungHo:"Cách gọi phụ huynh",tenGiaoVien:"Tên giáo viên",donViChuQuan:"Đơn vị chủ quản",tenSuKien:"Tên sự kiện",thanhPhan:"Thành phần tham dự / được mời",chuongTrinh:"Nội dung chương trình",luuY:"Lưu ý",loiKet:"Lời kết giáo viên muốn dùng",diaDanhNgay:"Địa danh, ngày ký",chucVuKy:"Chức vụ người ký",nguoiKy:"Họ tên người ký",quocHieu:"Ghi quốc hiệu, tiêu ngữ",tuanHoc:"Tuần học",chuDe:"Chủ đề",hocTap:"Hoạt động học tập nổi bật",vuiChoi:"Hoạt động vui chơi",ngoaiTroi:"Hoạt động ngoài trời",anNgu:"Ăn, ngủ, nề nếp chung",tuanToi:"Dự kiến tuần tới",doTuoi:"Độ tuổi của trẻ",hinhThuc:"Hình thức",mucTieu:"Mục tiêu bài tuyên truyền",doiTuongDoc:"Đối tượng đọc",boiCanh:"Bối cảnh",doDai:"Độ dài",diemNoiBat:"Diễn biến, điểm nổi bật",thongDiep:"Thông điệp",hashtag:"Hashtag riêng",diaChi:"Địa chỉ trường",soDienThoai:"Số điện thoại liên hệ",namHoc:"Năm học"},Nf={"thong-bao":`Nhiệm vụ: soạn một THÔNG BÁO gửi phụ huynh.
Bố cục: tiêu đề (THÔNG BÁO + nội dung ngắn) → lời kính gửi đúng đối tượng → câu mở đầu nêu lý do/mục đích (nếu có) → nội dung chính theo ý → thời gian, địa điểm (nếu có) → việc phụ huynh cần làm, mỗi việc một dòng → hạn phản hồi (nếu có) → lời cảm ơn lịch sự → ký tên theo thông tin có sẵn (giáo viên chủ nhiệm lớp …), không bịa tên người ký.
Tự điều chỉnh: thông báo khẩn → nêu điều cần làm ngay ở 1–2 câu đầu, ngắn, rõ; thông báo khoản thu → chỉ ghi đúng các khoản và số tiền được cung cấp, không thêm khoản nào; nghỉ lễ → có thể thêm lời chúc ngắn và nhắc giữ an toàn cho trẻ; họp phụ huynh → nhấn mạnh thời gian, địa điểm, đề nghị tham dự đúng giờ.`,"tin-nhan":`Nhiệm vụ: soạn một TIN NHẮN gửi phụ huynh qua Zalo — đọc trên điện thoại, dễ gửi ngay.
Bố cục: lời chào → nội dung chính → việc cần phụ huynh làm (nếu có) → lời cảm ơn. Tin nhóm lớp không nhắc tên riêng của trẻ.
Tình huống nhạy cảm (hành vi, sức khỏe, sự phát triển, va chạm giữa các bạn): mô tả khách quan đúng sự việc giáo viên kể, không thêm chi tiết, không kết luận vượt quá thông tin; nói rõ ở lớp cô đã/sẽ hỗ trợ con thế nào; mời phụ huynh chia sẻ thêm hoặc trao đổi trực tiếp; không dán nhãn trẻ, không trách phụ huynh, không nhắc tên trẻ khác. Với vấn đề sức khỏe, gợi ý phụ huynh theo dõi và hỏi ý kiến nhân viên y tế/bác sĩ khi cần.`,"thu-moi":`Nhiệm vụ: soạn nội dung THƯ MỜI/GIẤY MỜI bố cục rõ ràng, dễ dán sang Word hoặc Canva.
Bố cục: đơn vị tổ chức (tên đơn vị chủ quản và tên trường — CHỈ khi có trong dữ liệu) → tiêu đề THƯ MỜI hoặc GIẤY MỜI → "Trân trọng kính mời:" người/thành phần được mời → tên sự kiện → thời gian → địa điểm → nội dung chương trình và lưu ý (nếu có) → lời kết trân trọng phù hợp loại sự kiện → "Trân trọng kính mời!" → chức vụ và họ tên người ký (CHỈ khi có trong dữ liệu).
Chỉ ghi quốc hiệu "CỘNG HÒA XÃ HỘI CHỦ NGHĨA VIỆT NAM – Độc lập – Tự do – Hạnh phúc" khi mục "Ghi quốc hiệu, tiêu ngữ" là "Có". Không tự thêm địa danh, ngày ký, đơn vị chủ quản, người ký.`,"ban-tin":`Nhiệm vụ: tổng hợp BẢN TIN TUẦN của lớp gửi phụ huynh từ các hoạt động giáo viên cung cấp.
Bố cục: tiêu đề hấp dẫn (có tuần, chủ đề nếu có) → lời mở đầu thân thiện 1–2 câu → các mục có tiêu đề nhỏ, CHỈ cho những mục có dữ liệu (hoạt động nổi bật, vui chơi, ngoài trời, ăn ngủ nề nếp, phối hợp, tuần tới) → lời kết tích cực.
Có thể diễn đạt sinh động hoạt động đã có (con được làm gì, học được gì một cách khái quát), nhưng KHÔNG thêm hoạt động mới, KHÔNG suy đoán tình hình ăn, ngủ, sức khỏe hay sự tiến bộ của trẻ khi không có dữ liệu, KHÔNG nêu tên trẻ.`,"tuyen-truyen":`Nhiệm vụ: soạn bài TUYÊN TRUYỀN kiến thức nuôi dạy trẻ cho gia đình, đúng độ tuổi được chọn.
Yêu cầu: dễ hiểu với phụ huynh bình thường; thực tế, có những việc cụ thể gia đình làm được ngay tại nhà; phù hợp đặc điểm phát triển của lứa tuổi đó (24–36 tháng khác 5–6 tuổi); có thể đưa ví dụ tình huống quen thuộc trong gia đình Việt Nam. Chỉ đưa kiến thức phổ thông đã được thừa nhận rộng rãi; không đưa số liệu, nghiên cứu, mốc phát triển cụ thể hay khuyến cáo y tế nếu không chắc chắn. Chủ đề y tế, an toàn: thận trọng, nhắc tham khảo nhân viên y tế/bác sĩ, ghi số cấp cứu 115 khi nói về tai nạn.
Hình thức "Tin ngắn gửi Zalo": dưới 150 chữ. "Bảng tin": tiêu đề và các gạch đầu dòng ngắn để in dán bảng tuyên truyền. "Bài tuyên truyền đầy đủ": mở bài, các mục có tiêu đề, kết bài.`,"truyen-thong":`Nhiệm vụ: viết BÀI TRUYỀN THÔNG cho kênh của nhà trường theo loại bài và độ dài được chọn.
Bố cục: tiêu đề → phần mở đầu (sự kiện gì, khi nào, ở đâu — theo dữ liệu) → nội dung chính dựa trên diễn biến/điểm nổi bật được cung cấp → ý nghĩa khái quát của hoạt động với trẻ (không nêu kết quả cụ thể) → lời kết → hashtag nếu phù hợp.
Facebook/Zalo/bài lan tỏa: giọng gần gũi, 3–6 hashtag cuối bài (dùng hashtag riêng của trường nếu có). Website: văn phong tin bài giáo dục, không hashtag, không biểu tượng cảm xúc.

"+jn(i):""}`,`🎈 CÙNG NHÌN LẠI TUẦN HỌC${i?" – LỚP "+jn(i):""}`],t),a=B(l&&`🗓 ${l}`,o&&`🎯 Chủ đề: ${o}`),u=gn([`Kính gửi các bố mẹ thân mến! Cô xin gửi tới gia đình những hoạt động của các con${i?" lớp "+i:""} trong tuần vừa qua${o?`, với chủ đề “${o}”`:""}.`,`Các bố mẹ thân mến! Một tuần nữa lại trôi qua, cô cùng các con${i?" lớp "+i:""} đã có nhiều hoạt động${o?` xoay quanh chủ đề “${o}”`:""}. Cùng điểm lại nhé!`,`Chào các bố mẹ! Cô xin chia sẻ với gia đình bản tin tuần${l?" "+l:""} của lớp mình.`],t),h=Fm.map(j=>{const N=pt(n[j.key]);return N.length?B(`${j.icon} ${j.title.toLocaleUpperCase("vi")}`,N.map(v=>`- ${sn(v)}`)):""}),d=gn(["Cảm ơn các bố mẹ đã luôn đồng hành cùng cô và các con. Chúc gia đình một cuối tuần vui vẻ, đầm ấm! 💐","Mỗi ngày đến lớp là một ngày vui. Cảm ơn các bố mẹ đã cùng cô chăm sóc, yêu thương các con! 🌸","Cô cảm ơn sự quan tâm, phối hợp của các bố mẹ. Hẹn gặp lại các con vào tuần tới nhé! 🌼"],t),f=B(_(e.tenGiaoVien)&&`Cô giáo: ${_(e.tenGiaoVien)}`,_(e.tenTruong));return{text:hn(s,a,u,...h,d,f),title:`Bản tin tuần${l?" "+l:""}${i?" – "+i:""}`,notes:["Bản tin chỉ gồm các mục bạn đã nhập. Ứng dụng không tự thêm nhận xét sức khỏe hay kết quả học tập."],missing:[]}}const qa={"dinh-duong":{title:"Dinh dưỡng hợp lý – nền tảng cho bé khỏe mạnh",intro:"Ở lứa tuổi mầm non, cơ thể trẻ phát triển rất nhanh. Một chế độ ăn đủ chất, đa dạng và thói quen ăn uống tốt sẽ giúp trẻ khỏe mạnh, học tập và vui chơi tích cực.",tips:["Cho trẻ ăn đa dạng các nhóm thực phẩm: tinh bột, chất đạm, chất béo, rau củ và trái cây.","Cho trẻ ăn đúng bữa, đúng giờ; hạn chế cho ăn vặt, đồ ngọt, nước ngọt có ga trước bữa chính.","Tạo không khí bữa ăn vui vẻ, không ép, không quát mắng hay vừa ăn vừa xem điện thoại, ti vi.","Khuyến khích trẻ uống đủ nước, ưu tiên nước lọc.","Người lớn ăn uống lành mạnh để làm gương cho trẻ."],byAge:{"24-36":["Thức ăn nên mềm, cắt nhỏ vừa miệng để trẻ dễ nhai, tránh hóc.","Cho trẻ tập cầm thìa, tự xúc ăn dù còn rơi vãi – đó là cách trẻ học."],"3-4":["Cho trẻ làm quen dần với nhiều loại rau, củ bằng cách chế biến đẹp mắt, thay đổi món.","Khen ngợi khi trẻ ăn hết suất hoặc chịu thử món mới."],"4-5":["Cho trẻ cùng tham gia nhặt rau, bày bàn ăn để trẻ hứng thú với bữa ăn.","Trò chuyện với trẻ về tên và lợi ích của các loại thực phẩm."],"5-6":["Hướng dẫn trẻ nhận biết thực phẩm tốt và thực phẩm nên hạn chế.","Duy trì bữa sáng đầy đủ để trẻ có năng lượng học tập, chuẩn bị cho nếp sinh hoạt ở lớp Một."]},medical:"Nếu trẻ biếng ăn kéo dài, chậm tăng cân hoặc có dấu hiệu dị ứng thức ăn, phụ huynh nên đưa trẻ đến cơ sở y tế để được bác sĩ tư vấn, không tự ý cho trẻ dùng thuốc hay thực phẩm chức năng.",slogan:"Ăn đủ chất – Lớn khỏe mạnh – Học vui mỗi ngày!"},"ve-sinh":{title:"Vệ sinh cá nhân – bé sạch, bé khỏe",intro:"Thói quen vệ sinh cá nhân tốt giúp trẻ phòng tránh nhiều bệnh thường gặp và tự tin hơn khi sinh hoạt cùng bạn bè. Thói quen này được hình thành tốt nhất khi gia đình và nhà trường cùng nhắc nhở hằng ngày.",tips:["Hướng dẫn trẻ rửa tay bằng xà phòng và nước sạch trước khi ăn, sau khi đi vệ sinh, sau khi chơi.","Nhắc trẻ chải răng buổi sáng và buổi tối trước khi đi ngủ.","Cắt móng tay, móng chân cho trẻ thường xuyên; giữ quần áo, đầu tóc gọn gàng.","Dạy trẻ che miệng khi ho, hắt hơi và không dùng chung khăn, cốc với người khác.","Làm mẫu và cùng thực hiện với trẻ, biến việc vệ sinh thành trò chơi vui."],byAge:{"24-36":["Người lớn hỗ trợ trẻ rửa tay, lau mặt và cho trẻ làm theo từng bước đơn giản.","Tập cho trẻ báo khi có nhu cầu đi vệ sinh, khen ngợi khi trẻ làm được."],"3-4":["Cho trẻ tự rửa tay, lau mặt với sự quan sát của người lớn.","Dùng bài hát, bài thơ ngắn để trẻ nhớ các bước rửa tay."],"4-5":["Khuyến khích trẻ tự chải răng, tự đi vệ sinh và nhắc trẻ rửa tay sau đó.","Cho trẻ tự chọn khăn, bàn chải riêng để trẻ có ý thức giữ đồ dùng cá nhân."],"5-6":["Để trẻ tự thực hiện đầy đủ các bước rửa tay, chải răng; người lớn kiểm tra và động viên.","Trò chuyện để trẻ hiểu vì sao cần giữ vệ sinh, giúp trẻ tự giác hơn."]},medical:"Khi trẻ có biểu hiện bất thường như sốt, nổi ban, đau bụng, tiêu chảy…, phụ huynh nên cho trẻ nghỉ ngơi, đưa trẻ đến cơ sở y tế để được khám và thông báo cho giáo viên.",slogan:"Bàn tay sạch – Hàm răng xinh – Bé khỏe mạnh!"},"tai-nan":{title:"Phòng tránh tai nạn thương tích cho trẻ",intro:"Trẻ mầm non hiếu động, tò mò nhưng chưa nhận biết hết nguy hiểm. Nhiều tai nạn thương tích có thể phòng tránh được nếu người lớn quan tâm, sắp xếp môi trường an toàn và luôn để mắt tới trẻ.",tips:["Luôn có người lớn trông trẻ, đặc biệt khi trẻ chơi gần nước, ao hồ, bể chứa, xô chậu nước.","Để thuốc, hóa chất tẩy rửa, vật sắc nhọn, bật lửa ở nơi cao, có khóa, ngoài tầm với của trẻ.","Che chắn ổ điện, lan can, cầu thang, cửa sổ; không để trẻ chơi gần bếp đang đun nấu.","Cho trẻ đội mũ bảo hiểm khi ngồi xe máy và ngồi đúng vị trí an toàn.","Dạy trẻ không đi theo, không nhận quà của người lạ; nhớ tên bố mẹ và cách nhờ người lớn giúp đỡ."],byAge:{"24-36":["Không cho trẻ chơi đồ vật nhỏ dễ nuốt (hạt, cúc áo, pin cúc áo, đồ chơi nhỏ) và cắt nhỏ thức ăn để tránh hóc.","Không để trẻ một mình trong nhà tắm, trên giường cao hoặc gần cửa mở."],"3-4":["Dạy trẻ nhận biết đồ vật nguy hiểm: dao, kéo, ổ điện, bếp nóng… qua tranh ảnh, câu chuyện.","Hướng dẫn trẻ đi cầu thang bám tay vịn, không xô đẩy bạn khi chơi."],"4-5":["Dạy trẻ một số quy tắc an toàn khi tham gia giao thông: đi bên phải, nắm tay người lớn khi qua đường.","Tập cho trẻ biết kêu cứu, tìm người lớn khi gặp tình huống nguy hiểm."],"5-6":["Cho trẻ thực hành các kỹ năng như: xử lý khi bị lạc, nhớ số điện thoại người thân, không mở cửa cho người lạ.","Trò chuyện về an toàn khi ở gần nước; tham gia lớp học bơi phù hợp lứa tuổi khi có điều kiện và có người hướng dẫn."]},medical:"Khi trẻ gặp tai nạn (ngã, bỏng, hóc dị vật, đuối nước, ngộ độc…), cần bình tĩnh sơ cứu theo hướng dẫn và nhanh chóng đưa trẻ đến cơ sở y tế gần nhất hoặc gọi cấp cứu 115.",slogan:"Nhà an toàn – Bé vui chơi – Bố mẹ yên tâm!"},"ngon-ngu":{title:"Cùng con phát triển ngôn ngữ",intro:"Ngôn ngữ giúp trẻ bày tỏ suy nghĩ, cảm xúc và kết nối với mọi người. Những cuộc trò chuyện hằng ngày, những câu chuyện trước giờ ngủ là “bài học” quý giá nhất để trẻ phát triển ngôn ngữ.",tips:["Dành thời gian trò chuyện với trẻ mỗi ngày, lắng nghe và đáp lại khi trẻ nói.","Đọc sách, kể chuyện, đọc thơ cho trẻ nghe; khuyến khích trẻ kể lại theo cách của mình.","Dùng câu đơn giản, rõ ràng; nói đúng, không nói ngọng theo trẻ.","Đặt câu hỏi mở như “Vì sao…?”, “Con thấy thế nào…?” để trẻ được diễn đạt.","Hạn chế để trẻ xem màn hình một mình trong thời gian dài, ưu tiên giao tiếp trực tiếp."],byAge:{"24-36":["Gọi tên đồ vật, hành động khi chăm sóc trẻ (“Mẹ đang rửa tay cho con”) để trẻ học từ mới.","Kiên nhẫn chờ trẻ nói, khen khi trẻ cố gắng diễn đạt."],"3-4":["Cho trẻ hát, đọc đồng dao, thơ ngắn; chơi trò gọi tên đồ vật, con vật.","Khuyến khích trẻ nói thành câu khi muốn điều gì."],"4-5":["Cùng trẻ kể lại một ngày ở lớp, xem tranh và đặt câu hỏi về nội dung tranh.","Cho trẻ làm quen với chữ qua sách tranh, biển hiệu trong cuộc sống một cách tự nhiên."],"5-6":["Khuyến khích trẻ kể chuyện sáng tạo, nói về mong muốn, cảm xúc của mình.","Cho trẻ làm quen với chữ cái, cách cầm bút, tư thế ngồi đúng qua trò chơi, không gò ép trẻ học viết trước."]},medical:"Nếu phụ huynh lo lắng về khả năng nghe, nói của trẻ (ví dụ trẻ ít phản ứng với âm thanh, nói rất ít so với bạn cùng tuổi), nên trao đổi với giáo viên và đưa trẻ đến cơ sở y tế chuyên khoa để được tư vấn.",slogan:"Mỗi ngày một câu chuyện – Bé nói giỏi, hiểu nhiều!"},"cam-xuc":{title:"Nuôi dưỡng cảm xúc và kỹ năng xã hội cho trẻ",intro:"Trẻ biết nhận ra và bày tỏ cảm xúc, biết chia sẻ và hợp tác sẽ tự tin, vui vẻ hơn khi đến lớp. Gia đình là nơi đầu tiên trẻ học cách yêu thương và ứng xử.",tips:["Gọi tên cảm xúc cùng trẻ: vui, buồn, giận, sợ… và lắng nghe khi trẻ chia sẻ.","Chấp nhận cảm xúc của trẻ, hướng dẫn trẻ cách bày tỏ phù hợp thay vì quát mắng.","Dạy trẻ nói “cảm ơn”, “xin lỗi”, “xin phép” và làm gương trong cách cư xử hằng ngày.","Tạo cơ hội cho trẻ chơi cùng bạn, chia sẻ đồ chơi, chờ đến lượt.","Khen ngợi cụ thể hành vi tốt của trẻ, tránh so sánh trẻ với bạn khác."],byAge:{"24-36":["Ôm ấp, vỗ về khi trẻ buồn hoặc lo lắng lúc mới đi lớp; nói lời tạm biệt rõ ràng, đón trẻ đúng giờ.","Cho trẻ chơi cạnh bạn, tập chia sẻ đồ chơi đơn giản."],"3-4":["Đọc truyện về cảm xúc và hỏi trẻ “Bạn nhỏ đang cảm thấy thế nào?”.","Hướng dẫn trẻ hít thở sâu, ôm gấu bông khi tức giận."],"4-5":["Cho trẻ cùng giải quyết mâu thuẫn nhỏ với bạn bằng lời nói, có người lớn hỗ trợ.","Giao cho trẻ việc nhỏ giúp đỡ người khác để trẻ thấy mình có ích."],"5-6":["Khuyến khích trẻ làm việc nhóm, biết lắng nghe ý kiến của bạn.","Trò chuyện về những tình huống ứng xử ở trường, ở nhà để trẻ tự đưa ra cách giải quyết."]},medical:"Nếu trẻ có những thay đổi bất thường kéo dài về cảm xúc, hành vi (rất sợ hãi, thu mình, cáu giận thường xuyên), phụ huynh nên trao đổi với giáo viên và tham khảo ý kiến chuyên gia tâm lý hoặc cán bộ y tế.",slogan:"Hiểu con – Yêu con – Đồng hành cùng con!"},"lop-mot":{title:"Chuẩn bị tâm thế cho trẻ vào lớp Một",intro:"Chuẩn bị cho trẻ vào lớp Một không phải là dạy trước chương trình, mà là giúp trẻ sẵn sàng về sức khỏe, cảm xúc, nề nếp và kỹ năng để trẻ tự tin, hào hứng bước vào môi trường mới.",tips:["Trò chuyện tích cực về trường tiểu học, tránh dọa nạt kiểu “Lên lớp Một cô phạt”.","Rèn nếp sinh hoạt: ngủ đủ giấc, dậy đúng giờ, ăn sáng đầy đủ.","Tập cho trẻ tự phục vụ: tự chuẩn bị cặp sách, đồ dùng, tự đi vệ sinh, tự mặc quần áo.","Cho trẻ làm quen với tư thế ngồi, cách cầm bút, cách giở sách qua trò chơi, không ép học viết, học đọc trước.","Khuyến khích trẻ mạnh dạn hỏi khi chưa hiểu, biết nhờ giúp đỡ và hòa đồng với bạn mới."],byAge:{"24-36":["Ở lứa tuổi này, gia đình tập trung xây dựng nền nếp ăn, ngủ, vệ sinh và sự gắn bó, an toàn về cảm xúc cho trẻ."],"3-4":["Hình thành dần nề nếp sinh hoạt đúng giờ và thói quen tự phục vụ đơn giản – nền tảng cho những năm học sau."],"4-5":["Cho trẻ tham gia các trò chơi rèn sự tập trung, ghi nhớ, khéo léo của đôi tay như xâu hạt, cắt dán, xếp hình."],"5-6":["Cùng trẻ tham quan trường tiểu học (nếu có điều kiện), cùng chọn cặp sách, đồ dùng học tập để trẻ hào hứng.","Tập cho trẻ ngồi tập trung trong khoảng thời gian ngắn với một hoạt động yêu thích, tăng dần theo khả năng."]},medical:"Nên cho trẻ khám sức khỏe định kỳ, kiểm tra thị lực, thính lực theo hướng dẫn của cơ sở y tế trước khi vào lớp Một.",slogan:"Sẵn sàng – Tự tin – Vui bước vào lớp Một!"},"phoi-hop":{title:"Gia đình và nhà trường – cùng nhau vì trẻ",intro:"Sự phối hợp chặt chẽ giữa gia đình và nhà trường giúp việc chăm sóc, giáo dục trẻ được thống nhất, liên tục. Khi trẻ thấy bố mẹ và cô giáo cùng đồng lòng, trẻ sẽ yên tâm, tự tin và tiến bộ hơn.",tips:["Thường xuyên trao đổi với giáo viên khi đưa đón trẻ hoặc qua kênh liên lạc của lớp.","Thông báo sớm cho giáo viên khi trẻ có thay đổi về sức khỏe, thói quen, tâm lý.","Duy trì ở nhà những nề nếp, thói quen tốt trẻ được học ở lớp.","Tham gia các buổi họp, hoạt động, ngày hội của lớp và nhà trường khi có thể.","Trao đổi thẳng thắn, tôn trọng khi có băn khoăn; cùng giáo viên tìm cách hỗ trợ trẻ."],byAge:{"24-36":["Giai đoạn trẻ mới đi lớp rất cần gia đình và cô giáo thống nhất giờ ăn, giờ ngủ, cách dỗ dành để trẻ nhanh thích nghi."],"3-4":["Cùng con kể về một ngày ở lớp mỗi tối; hỏi cô về bài hát, bài thơ con được học để cùng ôn ở nhà."],"4-5":["Hưởng ứng các hoạt động lớp đề nghị như góp nguyên vật liệu tái chế, cùng con làm đồ chơi theo chủ đề."],"5-6":["Cùng giáo viên theo dõi sự chuẩn bị của trẻ cho lớp Một: nề nếp, kỹ năng tự phục vụ, sự tự tin trong giao tiếp."]},medical:"",slogan:"Nhà trường – Gia đình chung tay vì trẻ thân yêu!"},"thiet-bi":{title:"Sử dụng thiết bị điện tử hợp lý cho trẻ",intro:"Điện thoại, máy tính bảng, ti vi có thể mang lại một số nội dung hữu ích, nhưng nếu trẻ dùng quá nhiều hoặc xem nội dung không phù hợp sẽ ảnh hưởng đến giấc ngủ, thị lực, ngôn ngữ và sự tương tác của trẻ.",tips:["Đặt quy định rõ ràng về thời gian và nội dung trẻ được xem; người lớn chọn nội dung phù hợp và xem cùng trẻ.","Không dùng điện thoại để dỗ trẻ ăn, dỗ trẻ ngủ.","Không để thiết bị điện tử trong phòng ngủ của trẻ; tắt màn hình trước giờ ngủ.","Thay thế thời gian xem màn hình bằng đọc sách, chơi vận động, chơi ngoài trời, cùng làm việc nhà.","Người lớn hạn chế dùng điện thoại khi ở bên trẻ để làm gương."],byAge:{"24-36":["Với trẻ dưới 3 tuổi, nên hạn chế tối đa thời gian xem màn hình; ưu tiên trò chuyện, chơi và đọc sách cùng trẻ."],"3-4":["Nếu cho trẻ xem, nên chọn nội dung chậm, nhẹ nhàng, có người lớn ngồi cùng và trò chuyện về nội dung."],"4-5":["Thống nhất với trẻ “giờ xem” cụ thể và báo trước khi hết giờ để trẻ không bị hụt hẫng."],"5-6":["Hướng dẫn trẻ hiểu vì sao cần giới hạn thời gian dùng thiết bị và cùng trẻ lên kế hoạch các hoạt động thay thế."]},medical:"Nếu trẻ hay dụi mắt, nheo mắt, khó ngủ hoặc chậm nói, phụ huynh nên đưa trẻ đến cơ sở y tế để được kiểm tra và tư vấn.",slogan:"Bớt màn hình – Thêm yêu thương – Bé lớn khôn!"},"tu-phuc-vu":{title:"Rèn thói quen tự phục vụ cho trẻ",intro:"Khi được tự làm những việc vừa sức, trẻ trở nên tự tin, khéo léo và có trách nhiệm hơn. Mỗi việc nhỏ trẻ tự làm được là một bước trưởng thành.",tips:["Giao cho trẻ những việc vừa sức như tự xúc ăn, tự cất đồ chơi, tự đi dép, cất cặp.","Hướng dẫn từng bước rõ ràng, làm mẫu và kiên nhẫn chờ trẻ làm.","Không làm thay trẻ vì vội; dành thêm thời gian để trẻ tự thực hiện.","Khen ngợi sự cố gắng của trẻ, không chê khi trẻ làm chưa khéo.","Thống nhất với giáo viên để trẻ được rèn đều đặn cả ở nhà và ở lớp."],byAge:{"24-36":["Tập cho trẻ tự cầm cốc uống nước, tự xúc ăn, cởi giày dép, cất đồ chơi vào rổ."],"3-4":["Cho trẻ tự rửa tay, lau mặt, mặc và cởi quần áo đơn giản, cất dép đúng chỗ."],"4-5":["Cho trẻ tự gấp quần áo đơn giản, chuẩn bị đồ dùng cá nhân, giúp người lớn dọn bàn ăn."],"5-6":["Để trẻ tự chuẩn bị cặp sách, tự sắp xếp góc học tập, tự buộc dây giày (nếu có) và làm một số việc nhà vừa sức."]},medical:"",slogan:"Bé tự làm – Bé tự tin – Bé lớn khôn!"},"moi-truong":{title:"Cùng bé bảo vệ môi trường",intro:"Giáo dục bảo vệ môi trường từ nhỏ giúp trẻ biết yêu thiên nhiên, có ý thức giữ gìn vệ sinh và hình thành những thói quen tốt cho cuộc sống.",tips:["Hướng dẫn trẻ bỏ rác đúng nơi quy định và cùng trẻ phân loại rác đơn giản.","Cùng trẻ tiết kiệm điện, nước: tắt đèn khi ra khỏi phòng, khóa vòi nước khi không dùng.","Tận dụng vật liệu tái chế (chai nhựa, hộp giấy, lõi giấy…) để cùng trẻ làm đồ chơi.","Cùng trẻ trồng và chăm sóc cây xanh, quan sát sự lớn lên của cây.","Hạn chế dùng túi ni lông, đồ nhựa dùng một lần; làm gương cho trẻ trong sinh hoạt hằng ngày."],byAge:{"24-36":["Cho trẻ tập bỏ rác vào thùng, cất đồ chơi gọn gàng cùng người lớn."],"3-4":["Cùng trẻ tưới cây, nhặt lá rụng; dạy trẻ không bứt lá, bẻ cành."],"4-5":["Cho trẻ phân loại rác theo màu thùng, cùng làm đồ chơi từ vật liệu tái chế."],"5-6":["Trò chuyện với trẻ về ô nhiễm môi trường bằng ví dụ gần gũi; khuyến khích trẻ nhắc nhở người thân cùng bảo vệ môi trường."]},medical:"",slogan:"Môi trường xanh – Cuộc sống lành – Bé khỏe mạnh!"}};function Qm(n,e){if(!n.length)return n;const t=e%n.length;return[...n.slice(t),...n.slice(0,t)]}function Gm(n,e={},t=0){const i=qa[n.chuDe]||qa["dinh-duong"],l=Hi(yg,n.doTuoi)||"",o=i.byAge[n.doTuoi]||[],s=n.doDai||"vua",a=Qm(i.tips,t).slice(0,s==="ngan"?3:s==="vua"?4:5),u=_(n.mucTieu),h=_(n.doiTuongDoc),d=_(n.boiCanh),f=_(n.tenTruong),y=jl(n.tenLop),j=B(y&&`Lớp ${y}`,f),N=n.hinhThuc||"bai-viet";let v;if(N==="zalo")v=hn(`🌱 GÓC CHIA SẺ: ${i.title.toLocaleUpperCase("vi")}`,gn(["Kính gửi các bố mẹ!","Các bố mẹ thân mến!","Chào các bố mẹ!"],t)+(d?` ${sn(d)}`:"")+` Cô xin chia sẻ vài gợi ý nhỏ cho các bé${l?" "+l:""}:`,B([...a.slice(0,3),...o.slice(0,1)].map(C=>`✅ ${C}`)),i.medical&&`⚕️ ${i.medical}`,`💐 ${i.slogan}`);else if(N==="bang-tin")v=hn(jn(i.title),l&&`(Dành cho phụ huynh có con ${l})`
